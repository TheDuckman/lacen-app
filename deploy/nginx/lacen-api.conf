# /etc/nginx/sites-available/lacen-api
# Symlink to /etc/nginx/sites-enabled/lacen-api
#
# Domain:  YOUR_DOMAIN  (e.g. YOUR_SERVER_IP.sslip.io — replace YOUR_SERVER_IP with your server's public IP)
# If you migrate to a custom domain later, replace YOUR_DOMAIN
# everywhere in this file and re-run: certbot --nginx -d your.domain.com
#
# HOW THIS WORKS WITH CERTBOT:
#   This file only defines the HTTP (port 80) server block.
#   When you run `certbot --nginx`, it reads this block, copies the location
#   entries into a new HTTPS (port 443) server block, and adds the
#   ssl_certificate directives automatically. All proxy settings are inside
#   the location blocks so they get copied correctly.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Allow large file uploads (CSV files)
    client_max_body_size 500M;

    # Certbot ACME challenge — needed for initial cert issuance and renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Socket.IO (production path = /socket) ---
    # TLS terminates at nginx; internal hop to Node is plain HTTP (loopback only)
    location /socket {
        proxy_pass             http://127.0.0.1:3000;
        proxy_buffering        off;
        proxy_http_version     1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600;
        proxy_send_timeout  3600;
    }

    # --- REST API and static files ---
    location / {
        proxy_pass             http://127.0.0.1:3000;
        proxy_http_version     1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    3600;
        proxy_connect_timeout 60;
        proxy_send_timeout    3600;
        send_timeout          3600;
    }
}
